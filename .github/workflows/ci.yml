name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: error }
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: rust, build-mode: none }
      - uses: github/codeql-action/analyze@v4
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: inp-calendar-bot:ci }
      - run: docker run --rm --entrypoint sh inp-calendar-bot:ci -c 'test -x /usr/local/bin/inp-calendar-bot'
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "inp-calendar-bot:ci", format: sarif, output: trivy.sarif, severity: "CRITICAL,HIGH,MEDIUM" }
      - uses: github/codeql-action/upload-sarif@v4
        if: github.event.repository.visibility == 'public'
        continue-on-error: true
        with: { sarif_file: trivy.sarif, category: trivy-image }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "inp-calendar-bot:ci", severity: "CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: anchore/sbom-action@v0
        with: { image: "inp-calendar-bot:ci", format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/upload-artifact@v7
        with: { name: "sbom-${{ github.sha }}", path: sbom.spdx.json }
  ci-success:
    if: always()
    runs-on: ubuntu-latest
    needs: [rust, audit, dockerfile, secrets, codeql, image]
    steps:
      - env: { NEEDS: "${{ toJSON(needs) }}" }
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
